<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ExposureIQ icon — four cooperating agents">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132038"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgA)"/>

  <!-- fully-connected: each agent reads every peer -->
  <g stroke="#2F5A9E" stroke-width="16" stroke-linecap="round">
    <line x1="168" y1="168" x2="344" y2="168"/>
    <line x1="168" y1="344" x2="344" y2="344"/>
    <line x1="168" y1="168" x2="168" y2="344"/>
    <line x1="344" y1="168" x2="344" y2="344"/>
    <line x1="168" y1="168" x2="344" y2="344"/>
    <line x1="344" y1="168" x2="168" y2="344"/>
  </g>

  <g stroke="#0C1220" stroke-width="12">
    <circle cx="168" cy="168" r="42" fill="#60A5FA"/>
    <circle cx="344" cy="168" r="42" fill="#60A5FA"/>
    <circle cx="168" cy="344" r="42" fill="#60A5FA"/>
    <circle cx="344" cy="344" r="42" fill="#FBBF24"/>
  </g>
</svg>
