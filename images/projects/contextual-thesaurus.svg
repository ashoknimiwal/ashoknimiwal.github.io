<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Contextual Thesaurus icon — a term read inside its context">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2436"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgK)"/>

  <!-- the context that decides the reading -->
  <path d="M 196 140 L 140 140 L 140 372 L 196 372"
        fill="none" stroke="#22D3EE" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 316 140 L 372 140 L 372 372 L 316 372"
        fill="none" stroke="#22D3EE" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the term, and the sense it resolves to -->
  <rect x="186" y="218" width="140" height="30" rx="15" fill="#2A7F98"/>
  <rect x="186" y="278" width="140" height="30" rx="15" fill="#FBBF24"/>
</svg>
